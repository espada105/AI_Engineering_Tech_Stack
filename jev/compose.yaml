name: jev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      JEV_GREETING: ${JEV_GREETING:-Hello from jev!}
    volumes:
      - .:/workspace
      - venv:/opt/venv

volumes:
  venv:
